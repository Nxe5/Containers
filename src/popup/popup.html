<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <!-- Home page -->
      <div id="page-home" class="page">
        <header>
          <img src="../icons/icon.svg" alt="" width="20" height="20" />
          <span>Better Containers</span>
          <button id="openOptions" class="icon-btn header-options-btn" aria-label="Options" title="Options">⚙</button>
        </header>

        <button id="extensionToggleBtn" class="ext-toggle-btn"></button>
        <p id="extensionToggleHint" class="hint ext-toggle-hint hidden">
          Auto-isolation and container proxies are paused. Manual actions below still work.
        </p>

        <section class="actions">
          <button class="primary action-btn" data-action="new">Open new tab in…</button>
          <button class="primary action-btn" data-action="reopen">Reopen this site in…</button>
          <button class="primary action-btn" data-action="always">Always open this site in…</button>
          <p id="siteHint" class="hint">—</p>
          <button id="fillLoginBtn" class="secondary fill-login-btn hidden" disabled>Fill login</button>
        </section>

        <section class="toggles">
          <label class="toggle">
            <input type="checkbox" id="isolateToggle" />
            <span>Auto isolate all unmatched tabs</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="replaceToggle" />
            <span>Replace tab instead of opening new one</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="stickyToggle" />
            <span>Keep links in their origin container</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="authFlowToggle" />
            <span>Keep sign-in flows where they start</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="linkedTabToggle" />
            <span>Keep new tabs and windows in their origin container</span>
          </label>
        </section>

        <section class="container-list-section">
          <h2>Containers</h2>
          <input type="search" id="homeSearch" placeholder="Search containers…" />
          <div id="homeContainers" class="container-list"></div>
        </section>
      </div>

      <!-- Container selection page -->
      <div id="page-select" class="page hidden">
        <header class="select-header">
          <button id="backButton" class="icon-btn" aria-label="Back">←</button>
          <span id="selectTitle">Choose container</span>
        </header>
        <input type="search" id="selectSearch" placeholder="Search containers…" />
        <div id="selectContainers" class="container-list"></div>
      </div>

      <!-- Fill-login account picker overlay -->
      <div id="fillPickerOverlay" class="modal-overlay hidden">
        <div class="modal">
          <p>Choose a login to fill</p>
          <div id="fillPickerList" class="fill-picker-list"></div>
          <div class="modal-actions">
            <button id="fillPickerCancel" class="secondary">Cancel</button>
          </div>
        </div>
      </div>

      <!-- Disable confirmation overlay -->
      <div id="disableConfirmOverlay" class="modal-overlay hidden">
        <div class="modal">
          <p>Disable Better Containers?</p>
          <p class="hint">
            Auto-isolation and container proxies will stop working until you
            turn it back on. This popup will still work.
          </p>
          <div class="modal-actions">
            <button id="disableConfirmCancel" class="secondary">Cancel</button>
            <button id="disableConfirmOk" class="danger">Disable</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
